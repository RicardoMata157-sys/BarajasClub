<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>ALTA EDICIONES</title>
  <!-- Bootstrap (para previsualización en tu app ya lo tienes cargado) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .stepper .badge{font-weight:600}
    .numbers-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(64px,1fr)); gap:.5rem}
    .numbers-grid .cell{border:1px solid rgba(0,0,0,.1); border-radius:.5rem; padding:.5rem 0; text-align:center; font-variant-numeric:tabular-nums}
  </style>

<head th:replace="~{fragments_admin :: head('Admin - Nueva Rifa')}"></head>
<body>
	<header th:replace="~{fragments_admin :: navbar}"></header>
	<main class="container py-4">
		<!-- HERO de sección: conserva el look Bootstrap pero más visual -->
<div class="mb-3">
  <div class="bg-light border rounded-3 p-3 p-md-4 shadow-sm d-flex justify-content-between align-items-center flex-wrap gap-3">
    <div class="d-flex align-items-center gap-3">
      <!-- Icono decorativo -->
      <span class="rounded-circle d-inline-flex align-items-center justify-content-center bg-primary-subtle text-primary" style="width:48px;height:48px;">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M8 0l3.09 6.26L18 7.27l-5 4.87L14.18 18 8 14.77 1.82 18 3 12.14-2 7.27l6.91-1.01L8 0z" transform="scale(.8) translate(2,1)"/>
        </svg>
      </span>
      <div>
        <h1 class="h5 m-0 text-uppercase" style="letter-spacing:.06em">ALTA EDICIONES</h1>
        <small class="text-muted">Crea una nueva edición, define parámetros y sube la imagen.</small>
      </div>
    </div>
    <!-- Badges de contexto -->
    <div class="d-flex align-items-center gap-2">
      <span class="badge text-bg-primary">Paso 1 de 4</span>
      <span class="badge text-bg-secondary">Formulario</span>
      
      
     <div class="stepper d-flex gap-2 align-items-center">
        <span class="badge text-bg-primary rounded-pill">1 · Detalles</span>
        <span class="badge text-bg-secondary rounded-pill">2 · Números</span>
        <span class="badge text-bg-primary rounded-pill">3 · Imagen</span>
        <span class="badge text-bg-secondaty rounded-pill">4 · Guardar</span>
      </div>
      
    
      
      
    </div>
  </div>
</div>

		<form th:action="@{/admin/rifas}" method="post" enctype="multipart/form-data">
		<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
			<div class="row g-3">
				<!-- Campos nuevos -->
				<div class="col-md-6">
					<label class="form-label">Nombre de la edicion</label> <input
						class="form-control" name="nombre" id="nombre" required>
				</div>

				<div class="col-md-3">
					<label class="form-label">Dígitos</label> <input
						class="form-control" name="digitos" id="digitos" type="number" min="1"
						required>
				</div>

				<div class="col-md-3">
					<label class="form-label">Valor máximo</label> <input
						class="form-control"  name="maxValor" id="maxValor" type="number" min="1"
						required>
				</div>

				<div class="col-md-3">
					<label class="form-label">Números por boleto</label> <input
						class="form-control" name="numerosPorBoleto" id="numerosPorBoletos" type="number"
						min="1" required>
				</div>

				<div class="col-md-3">
					<label class="form-label">Fecha inicio sorteo</label> <input
						class="form-control" name="fechaInicio" id="fechaInicio" type="date"
						required>
				</div>

				<div class="col-md-3">
					<label class="form-label">Fecha de sorteo</label> <input
						class="form-control" name="fechaFin"  id="fechaFin" type="date" required>
				</div>

				<div class="col-md-3">
					<label class="form-label">Precio por boleto</label> <input
						class="form-control" name="precioBoleto" id="precioBoleto" type="number"
						step="0.01" min="0" required>
				</div>

<!-- 				<div class="col-md-6"> -->
<!-- 					<label class="form-label">Ganador (opcional)</label> <input -->
<!-- 						class="form-control" name="ganadorRifa" -->
<!-- 						placeholder="Nombre / folio del ganador"> -->
<!-- 				</div> -->

				<div class="mb-3">
  <label class="form-label">Estado de la rifa</label>
  <select class="form-control" name="estadoRifa" id="estadoRifa" required>
    <option value="" disabled selected>Selecciona...</option>
    <option th:each="e : ${estadosRifa}" th:value="${e.nombre}" th:text="${e.nombre}"></option>
  </select>
</div>

<!-- <div class="mb-3"> -->
<!--   <label class="form-label">Total vendido</label> -->
<!--   <input class="form-control" name="totalVendido" id="totalVendido" type="number" readonly value="0"> -->
<!-- </div> -->



				<div class="col-md-6">
					<label class="form-label">Imagen</label> 
					<input class="form-control" name="image"  type="file" accept="image/*" id="imageInput">
				</div>
				<div class="col-md-6 d-flex align-items-end">
					<img id="imagePreview" class="img-thumbnail d-none"
						style="max-height: 120px" alt="preview">
				</div>
			</div>




			<div>
				<button class="btn btn-outline-secondary" type="button"
					id="btnPreview">Previsualizar números</button>
				<button class="btn btn-primary" type="submit">Guardar rifa</button>
			</div>

			<div id="numbersGrid" class="d-grid gap-2 mt-3"
				style="grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));"></div>
		</form>
	</main>

	<script>
  // Helper para enteros (busca por id y, si no, por name)
  function readIntById(id) {
    let el = document.getElementById(id) || document.querySelector(`[name="${id}"]`);
    const v = parseInt((el?.value || '').trim(), 10);
    return Number.isFinite(v) ? v : NaN;
  }

  function buildNumbers() {
    const fromEl = document.getElementById('numberFrom');
    const toEl   = document.getElementById('numberTo');
    const csvEl  = document.querySelector('input[name="customNumbersCsv"]');

    const from = fromEl ? parseInt(fromEl.value || 'NaN', 10) : NaN;
    const to   = toEl   ? parseInt(toEl.value   || 'NaN', 10) : NaN;
    const csv  = csvEl  ? (csvEl.value || '') : '';

    const set = new Set();

    // Rango
    if (!Number.isNaN(from) && !Number.isNaN(to) && from <= to) {
      for (let n = from; n <= to; n++) set.add(n);
    }

    // CSV
    if (csv && csv.trim().length) {
      csv.split(/[, \t\r\n]+/).forEach(x => {
        const n = parseInt(x, 10);
        if (Number.isFinite(n)) set.add(n);
      });
    }

    // Si no hay rango ni CSV, usar 0..maxValor
    if (set.size === 0) {
      const maxValor = readIntById('maxValor');
      if (Number.isFinite(maxValor) && maxValor >= 0) {
        for (let n = 0; n <= maxValor; n++) set.add(n);
      } else {
        alert('Ingresa un "Valor máximo" válido para previsualizar.');
        return 0;
      }
    }

    // Formateo con ceros a la izquierda según dígitos
    const digitos = readIntById('digitos');
    const pad = (num, width) => String(num).padStart(Math.max(1, width || 1), '0');

    // Render
    const grid = document.getElementById('numbersGrid');
    grid.innerHTML = '';
    Array.from(set).sort((a,b)=>a-b).forEach(n => {
      const div = document.createElement('div');
      div.className = 'border rounded text-center py-2';
      div.textContent = Number.isFinite(digitos) ? pad(n, digitos) : n;
      grid.appendChild(div);
    });

    return set.size;
  }

  document.getElementById('btnPreview')?.addEventListener('click', buildNumbers);

  // Preview de imagen
  document.getElementById('imageInput')?.addEventListener('change', (e) => {
    const file = e.target.files?.[0];
    const img = document.getElementById('imagePreview');
    if (file) {
      img.src = URL.createObjectURL(file);
      img.classList.remove('d-none');
    } else {
      img.src = '';
      img.classList.add('d-none');
    }
  });
</script>
	 <th:block th:replace="~{fragments_admin :: scripts}"></th:block>

</body>
</html>
