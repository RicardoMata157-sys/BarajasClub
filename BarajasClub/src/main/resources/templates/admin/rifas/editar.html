<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments_admin :: head('Admin - Editar Rifa')}"></head>
<body>
<header th:replace="~{fragments_admin :: navbar}"></header>

<main class="container py-4">
  <div class="row g-4">
    <!-- ===================== LADO IZQUIERDO: LISTA DE RIFAS ===================== -->
    <aside class="col-12 col-lg-4">
      <div class="card h-100">
        <div class="card-header">
          <div class="d-flex align-items-center gap-2">
            <span class="fw-semibold">EDICIONES</span>
            <a class="btn btn-sm btn-outline-primary ms-auto" th:href="@{/admin/rifas/nueva}">
              Nueva edición
            </a>
          </div>
        </div>
        <div class="card-body">
          <input id="filtroRifas" type="search" class="form-control mb-3" placeholder="Buscar rifa…">
          <div class="list-group small" id="listaRifas">
            <!-- Usa 'rifas' o 'todasRifas' según cómo lo nombres en tu controlador -->
            <a th:each="ri : ${rifas != null ? rifas : todasRifas}"
               th:href="@{'/admin/rifas/' + ${ri.id} + '/editar'}"
               class="list-group-item list-group-item-action d-flex align-items-center"
               th:classappend="${r != null and ri.id == r.id} ? ' active'">
              <img th:if="${ri.pathImagen}" th:src="${ri.pathImagen}" alt="" class="rounded me-2" style="height:26px;width:26px;object-fit:cover">
              <div class="flex-grow-1">
                <div class="fw-semibold" th:text="${ri.nombre}">Nombre rifa</div>
                <div class="text-muted"
                     th:text="'$' + ${ri.precioBoleto} + ' • #' + ${ri.id}">Precio • #ID</div>
              </div>
            </a>
            <div th:if="${#lists.isEmpty(rifas) and #lists.isEmpty(todasRifas)}"
                 class="text-muted text-center py-4">No hay rifas registradas</div>
          </div>
        </div>
      </div>
    </aside>

    <!-- ===================== LADO DERECHO: FORMULARIO + GRID ===================== -->
    <section class="col-12 col-lg-8">
      <!-- Header -->
      <div class="d-flex align-items-center gap-3 mb-3">
        <img th:if="${r.pathImagen}" th:src="${r.pathImagen}" alt="premio" class="rounded" style="height: 60px">
        <div>
          <h1 class="h5 mb-0" th:text="${r.nombre}">Rifa</h1>
          <div class="text-muted" th:text="'Precio por boleto: $' + ${r.precioBoleto}">Precio</div>
        </div>
      </div>

      <!-- Formulario de edición (idéntico al que ya tenías, sin collapse) -->
      <div class="card mb-4">
        <div class="card-body">
          <form th:action="@{'/admin/rifas/' + ${r.id}}" method="post" enctype="multipart/form-data">
            <input type="hidden" name="_method" value="put">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Nombre de la edicion</label>
                <input class="form-control" name="nombre" id="nombre" th:value="${r.nombre}" required>
              </div>

              <div class="col-md-3">
                <label class="form-label">Dígitos</label>
                <input class="form-control" name="digitos" id="digitos" th:value="${r.digitos}" type="number" min="1" required>
              </div>

              <div class="col-md-3">
                <label class="form-label">Valor máximo</label>
                <input class="form-control" name="maxValor" id="maxValor" th:value="${r.maxValor}" type="number" min="1" required>
              </div>

              <div class="col-md-3">
                <label class="form-label">Números por boleto</label>
                <input class="form-control" name="numerosPorBoleto" id="numerosPorBoleto" th:value="${r.numerosPorBoleto}" type="number" min="1" required>
              </div>

              <div class="col-md-3">
                <label class="form-label">Fecha inicio sorteo</label>
                <input class="form-control" name="fechaInicio"  id="fechaInicio" th:value="${r.fechaInicio}" type="date" required>
              </div>

              <div class="col-md-3">
                <label class="form-label">Fecha de sorteo</label>
                <input class="form-control" name="fechaFin" id="fechaFin" th:value="${r.fechaFin}" type="date" required>
              </div>

              <div class="col-md-3">
                <label class="form-label">Precio por boleto</label>
                <input class="form-control" name="precioBoleto" id="precioBoleto" th:value="${r.precioBoleto}" type="number" step="0.01" min="0" required>
              </div>

              <div class="col-md-6">
                <label class="form-label">Ganador (opcional)</label>
                <input class="form-control" name="ganadorRifa" th:value="${r.ganadorRifa}"
                       placeholder="Nombre / folio del ganador">
              </div>
              
              <div class="col-md-6">
                <label class="form-label">Monto Esperado</label>
                <input class="form-control" name="montoEsperado" id="montoEsperado" th:value="${montoEsperado}" type="text" disabled>
              </div>
              
              
               <div class="col-md-6">
                <label class="form-label">Monto recaudado</label>
                <input class="form-control" name="monroRecaudado" id="monroRecaudado" th:value="${r.nombre}" type="number" disabled="disabled">
              </div>

              <div class="col-md-3">
                <label class="form-label">Estado edicion</label>
                <select class="form-select" name="estadoEdicion" onchange="this.form.submit()">
                  <option th:if="${#lists.isEmpty(estadosRifa)}" disabled selected>No hay boletos creados</option>
                  <option th:each="ri : ${estadosRifa}"
                          th:value="${ri.id}"
                          th:text="${ri.nombre}"
                          th:selected="${estadoSeleccionado != null and ri.id == estadoSeleccionado.id}">
                  </option>
                </select>
              </div>

              <div class="col-md-6">
                <label class="form-label">Imagen</label>
                <input class="form-control" name="image" type="file" accept="image/*" id="imageInput">
              </div>
              <div class="col-md-6 d-flex align-items-end">
                <img id="imagePreview" class="img-thumbnail d-none" style="max-height: 120px" alt="preview">
              </div>
            </div>

            <div class="mt-3 d-flex gap-2">
              <button class="btn btn-primary">Guardar cambios</button>
              <a class="btn btn-outline-secondary" th:href="@{'/admin/rifas/' + ${r.id} + '/editar'}">Restablecer</a>
            </div>
          </form>
        </div>
      </div>

      <!-- Controles de previsualización de boletos -->
      <div class="card mb-3">
        <div class="card-body d-flex flex-wrap align-items-center gap-3">
          <button id="btnPreview" type="button" class="btn btn-outline-secondary">Previsualizar boletos</button>

           <div class="mt-3 small d-flex align-items-center gap-3">
    <span class="badge text-bg-success">Disponible</span>
    <span th:text="${numDisp != null ? #lists.size(numDisp) : 0}">0</span>

    <span class="badge text-bg-warning">Apartado</span>

    <span th:text="${pag != null ? #lists.size(pag) : 0}">0</span>
  </div>
</div>

<script>
  // Helper para enteros (busca por id y, si no, por name)
  function readIntById(id) {
    let el = document.getElementById(id) || document.querySelector(`[name="${id}"]`);
    const v = parseInt((el?.value || '').trim(), 10);
    return Number.isFinite(v) ? v : NaN;
  }

  function buildNumbers() {
    const fromEl = document.getElementById('numberFrom');
    const toEl   = document.getElementById('numberTo');
    const csvEl  = document.querySelector('input[name="customNumbersCsv"]');

    const from = fromEl ? parseInt(fromEl.value || 'NaN', 10) : NaN;
    const to   = toEl   ? parseInt(toEl.value   || 'NaN', 10) : NaN;
    const csv  = csvEl  ? (csvEl.value || '') : '';

    const set = new Set();

    // Rango
    if (!Number.isNaN(from) && !Number.isNaN(to) && from <= to) {
      for (let n = from; n <= to; n++) set.add(n);
    }

    // CSV
    if (csv && csv.trim().length) {
      csv.split(/[, \t\r\n]+/).forEach(x => {
        const n = parseInt(x, 10);
        if (Number.isFinite(n)) set.add(n);
      });
    }

    // Si no hay rango ni CSV, usar 0..maxValor
    if (set.size === 0) {
      const maxValor = readIntById('maxValor');
      if (Number.isFinite(maxValor) && maxValor >= 0) {
        for (let n = 0; n <= maxValor; n++) set.add(n);
      } else {
        alert('Ingresa un "Valor máximo" válido para previsualizar.');
        return 0;
      }
    }

    // Formateo con ceros a la izquierda según dígitos
    const digitos = readIntById('digitos');
    const pad = (num, width) => String(num).padStart(Math.max(1, width || 1), '0');

    // Render
    const grid = document.getElementById('numbersGrid');
    grid.innerHTML = '';
    Array.from(set).sort((a,b)=>a-b).forEach(n => {
      const div = document.createElement('div');
      div.className = 'border rounded text-center py-2';
      div.textContent = Number.isFinite(digitos) ? pad(n, digitos) : n;
      grid.appendChild(div);
    });

    return set.size;
  }

  document.getElementById('btnPreview')?.addEventListener('click', buildNumbers);

  // Preview de imagen
  document.getElementById('imageInput')?.addEventListener('change', (e) => {
    const file = e.target.files?.[0];
    const img = document.getElementById('imagePreview');
    if (file) {
      img.src = URL.createObjectURL(file);
      img.classList.remove('d-none');
    } else {
      img.src = '';
      img.classList.add('d-none');
    }
  });
</script>
