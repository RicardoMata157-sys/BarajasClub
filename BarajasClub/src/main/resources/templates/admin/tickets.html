<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Admin - Boletos')}"></head>
<body>
	<header th:replace="~{fragments :: navbar}"></header>
	<main class="container py-4">
		<h1 class="h5">
<!-- 			Administrar boletos — <span th:text="${r.title}">Rifa</span> -->
		</h1>


		<table class="table table-sm align-middle">
			<thead>
				<tr>
					<th>#</th>
					<th>Estado</th>
					<th>Acciones</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="t : ${tickets}">
					<td th:text="${t.numero}">1</td>
					<td><span class="badge"
						th:classappend="${t.status.name()=='DISPONIBLE'}?' text-bg-success':''"
						th:text="${t.status}">DISPONIBLE</span></td>
					<td>
						<form th:action="@{'/admin/tickets/' + ${t.id} + '/estado'}"
							method="post" class="d-inline">
							<select name="estado"
								class="form-select form-select-sm w-auto d-inline-block">
								<option
									th:each="s : ${T(com.tioandres.rifas.model.Ticket.Status).values()}"
									th:value="${s}" th:text="${s}" th:selected="${s==t.status}"></option>
							</select>
							<button class="btn btn-sm btn-outline-primary">Guardar</button>
						</form>
					</td>
				</tr>
			</tbody>
		</table>
	</main>
</body>
</html>
