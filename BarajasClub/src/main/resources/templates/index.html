<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
  <head th:replace="~{fragments :: head('CLUB BARAJAS')}"></head>
  <body>
    <header th:replace="~{fragments :: navbar}"></header>

    <section class="hero py-5 bg-gradient">
      <div class="container text-center">
        <h1 class="display-5 fw-bold text-white text-shadow">Barajas Club</h1>
        <p class="lead text-white-50 mb-4">Participa y gana premios increíbles. ¡Lugares limitados!</p>
        <div class="d-flex justify-content-center gap-3">
<!--           <a href="#rifas" class="btn btn-lg btn-primary">Ver rifas activas</a> -->
          <a href="#" class="btn btn-lg btn-outline-light">Cómo funciona</a>
        </div>
      </div>
    </section>

    <main class="py-5" id="rifas">
      <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h2 class="h4 mb-0">EDICIONES ACTIVAS</h2>
          <div class="input-group w-auto">
            <input class="form-control" placeholder="Buscar rifa..." />
            <button class="btn btn-outline-secondary">Buscar</button>
          </div>
        </div>

        <div class="row g-4">
          <div class="col-12 col-sm-6 col-lg-4" th:each="r : ${raffles}">
            <div class="card h-100 raffle-card shadow-sm position-relative">
              <div class="ratio ratio-16x9 bg-light">
                <img th:if="${r.pathImagen}" th:src="${r.pathImagen}" class="card-img-top object-fit-cover" alt="imagen rifa">
                <div th:if="${r.pathImagen == null}" class="placeholder-image d-flex align-items-center justify-content-center">
                  <span class="text-muted">Sin imagen</span>
                </div>
              </div>
              <div class="card-body d-flex flex-column">
                <h3 class="h6 card-title" th:text="${r.nombre}">Título de la rifa</h3>
                <div class="mb-2 small text-muted">
<!--                   <span th:text="'Boletos: ' + ${r.soldSlots} + '/' + ${r.totalSlots}">Boletos</span> · -->
<!--                   <span th:text="'Disponibles: ' + ${r.availableSlots}">Disponibles</span> -->
                </div>
                <div class="progress mb-3">
<!--                   <div class="progress-bar" role="progressbar" th:style="'width:' + ${r.progressPercent} + '%'" th:text="${r.progressPercent} + '%'">50%</div> -->
                </div>
                <div class="mt-auto d-flex justify-content-between align-items-center">
<!--                   <span class="fw-semibold" th:text="${#numbers.formatDecimal(r.ticketPrice, 1, 'COMMA', 2, 'POINT')} + ' MXN'">$0.00 MXN</span> -->
                  <a href="#" class="btn btn-sm btn-primary">Participar</a>
                </div>
                <span class="badge position-absolute top-0 end-0 m-3 bg-success" th:if="${r.estadoEdicion.nombre == 'ACTIVA'}">Activa</span>
                <span class="badge position-absolute top-0 end-0 m-3 bg-secondary" th:if="${r.estadoEdicion.nombre == 'PROXIMA'}">Próxima</span>
                <span class="badge position-absolute top-0 end-0 m-3 bg-dark" th:if="${r.estadoEdicion.nombre == 'CERRADA'}">Cerrada</span>
              </div>
            </div>
          </div>
        </div>

      </div>
    </main>

    <footer class="py-4 bg-dark text-white-50">
      <div class="container d-flex justify-content-between align-items-center">
        <span>&copy; <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}">2025</span> BARAJAS CLUB</span>
        <nav class="d-flex gap-3">
          <a class="link-light link-opacity-75" href="#">Términos</a>
          <a class="link-light link-opacity-75" href="#">Privacidad</a>
          <a class="link-light link-opacity-75" href="#">Contacto</a>
        </nav>
      </div>
    </footer>
  </body>
</html>
