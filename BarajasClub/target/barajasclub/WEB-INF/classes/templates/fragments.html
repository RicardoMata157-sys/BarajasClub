<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${title}">Barajas Club</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link th:href="@{/css/app.css}" rel="stylesheet">
</head>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>



<body>
<header th:fragment="navbar">
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">Barajas Club</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarsExample07">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarsExample07">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link active" href="/">Inicio</a></li>
<!--           <li class="nav-item"><a class="nav-link" href="/admin/rifas/editar">Administrar Ediciones</a></li> -->
<!--           <li class="nav-item"><a class="nav-link" href="/admin/rifa">Venta de Boletos</a></li> -->
        </ul>
					<div class="d-flex gap-2">

						<span class="navbar-text text-light me-2"
							sec:authorize="isAuthenticated()"> Hola, <span
							sec:authentication="name"></span>
						</span>

						<form th:action="@{/logout}" method="post"
							sec:authorize="isAuthenticated()">
							<input type="hidden" th:name="${_csrf.parameterName}"
								th:value="${_csrf.token}" />
							<button class="btn btn-outline-light btn-sm" type="submit">Cerrar
								cuenta</button>
						</form>



						<!-- Si NO hay sesión, muestra Iniciar sesión -->
						<a class="btn btn-outline-light btn-sm" th:href="@{/login}"
							sec:authorize="isAnonymous()"> Iniciar sesión </a>
					</div>
				</div>
    </div>
  </nav>
</header>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
