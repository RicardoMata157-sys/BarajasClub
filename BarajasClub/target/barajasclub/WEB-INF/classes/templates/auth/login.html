<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Iniciar sesión · Barajas Club</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <style>
    :root{
      --card-bg: rgba(255,255,255,.8);
      --blur: 12px;
    }
    html, body { height: 100%; }
    body { margin: 0; }

    .layout {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr;
    }
    /* En pantallas md+ mostramos dos columnas */
    @media (min-width: 768px){
      .layout { grid-template-columns: 1.2fr 1fr; }
    }

    /* Panel de imagen (usa el logo como imagen hero) */
    .hero-side{
      position: relative;
      background: #111;
      overflow: hidden;
      isolation: isolate;
    }
    .hero-side::before{
      content: "";
      position: absolute; inset: 0;
      background-image: url('/uploads/barajas-club.png');
      background-image: -webkit-image-set(url('/uploads/barajas-club.png') 1x);
      /* Thymeleaf */
      background-image: none;
    }
    /* Para Thymeleaf generamos un elemento interno que sí puede usar th:style */
  </style>
</head>
<body>
  <div class="layout">
    <!-- Lado visual -->
    <section class="hero-side d-none d-md-block">
      <div class="position-absolute top-0 start-0 w-100 h-100"
           th:style="'background-image:url(' + @{/uploads/barajas-club.png} + '); background-size: contain; background-repeat:no-repeat; background-position:center; background-color:#f7efe2'">
      </div>
      <!-- Gradiente para contraste -->
      <div class="position-absolute top-0 start-0 w-100 h-100"
           style="background: radial-gradient(60% 60% at 50% 40%, rgba(0,0,0,.18), transparent 60%), linear-gradient(to top, rgba(0,0,0,.15), transparent 40%); mix-blend-mode: multiply;">
      </div>
      <!-- Marca inferior -->
      <div class="position-absolute bottom-0 start-0 p-4 text-white-50 small">
        © Barajas Club
      </div>
    </section>

    <!-- Lado del formulario -->
    <main class="d-flex align-items-center justify-content-center p-3 p-md-5 bg-light">
      <div class="card shadow-lg border-0" style="max-width: 440px; width:100%; background: var(--card-bg); backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur));">
        <div class="card-body p-4 p-md-5">
          <div class="text-center mb-4">
            <img src="/uploads/barajas-club.png" th:src="@{/uploads/barajas-club.png}" alt="Barajas Club"
                 style="height: 64px; width:auto; object-fit: contain;" />
            <h1 class="h4 mt-3 mb-0 fw-bold">Bienvenido</h1>
            <p class="text-secondary mb-0">Inicia sesión para continuar</p>
          </div>

          <!-- Mensajes -->
          <div th:if="${param.error}" class="alert alert-danger">Usuario o contraseña inválidos.</div>
          <div th:if="${param.logout}" class="alert alert-success">Sesión cerrada correctamente.</div>

          <form th:action="@{/login}" method="post" class="vstack gap-3">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div class="form-floating">
              <input id="username" class="form-control" type="text" name="username" placeholder="Usuario" required autofocus>
              <label for="username">Usuario</label>
            </div>
            <div class="form-floating">
              <input id="password" class="form-control" type="password" name="password" placeholder="Contraseña" required>
              <label for="password">Contraseña</label>
            </div>
            <div class="d-flex justify-content-between align-items-center">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" name="remember-me" id="rememberMe">
                <label class="form-check-label" for="rememberMe">Recordarme</label>
              </div>
              <a class="small" href="#" onclick="return false;">¿Olvidaste tu contraseña?</a>
            </div>
            <button class="btn btn-dark py-2" type="submit">Entrar</button>
          </form>

          <div class="text-center mt-3">
            <a th:href="@{/}">Volver al inicio</a>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
          crossorigin="anonymous"></script>
</body>
</html>
